name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: flox/install-flox-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install locked dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Shared local and CI checks
        run: flox activate -- bun run check
      - name: Unit and integration tests with coverage
        run: flox activate -- bun run test:coverage
      - name: Production and Lambda builds
        run: flox activate -- bun run build:all
      - name: Browser dependencies
        run: flox activate -- bunx playwright install --with-deps chromium
      - name: Browser journeys and accessibility
        run: flox activate -- bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            client/coverage
            playwright-report
          retention-days: 7
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: flox/install-flox-action@v2
      - run: flox activate -- bun run check:infra
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check:security
