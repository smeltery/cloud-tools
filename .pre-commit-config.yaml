repos:
  - repo: local
    hooks:
      - id: check
        name: Shared CI checks
        entry: flox activate -- bun run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: infrastructure
        name: Infrastructure checks
        entry: flox activate -- bun run check:infra
        language: system
        pass_filenames: false
        files: ^(infrastructure/|scripts/.*\.sh$)
        stages: [pre-commit]
      - id: tests-and-build
        name: Tests and production build
        entry: flox activate -- bash -c 'bun run test:coverage && bun run build:all && bun run test:e2e && bun run check:security'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
